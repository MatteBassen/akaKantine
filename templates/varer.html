{% extends "base.html" %}

{% block title %}
    Varer
{% endblock %}

{% block content %}
    <div class="varerBody">
    <h1>Varer</h1>
        <div class="varer">
        {% for vare in varer %}
            <div class="vare">
                <h2>{{ vare.navn }}</h2>
                <img class="vareImg" src="{{ vare.bilde }}">
                <h2>{{ vare.pris }} kr</h2>
            </div>
        {% endfor %}
        </div>
    </div>

{% endblock %}
